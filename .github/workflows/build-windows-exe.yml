name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build portable Windows package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Smoke test core modules
        shell: pwsh
        run: |
          python scripts/smoke_test.py

      - name: Build executable package
        shell: pwsh
        run: |
          python scripts/build_exe.py

      - name: Create zip package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/ECC_Analyzer_Pro" -DestinationPath "ECC_Analyzer_Pro_Windows_x64.zip" -Force
          Get-Item "ECC_Analyzer_Pro_Windows_x64.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECC_Analyzer_Pro_Windows_x64
          path: ECC_Analyzer_Pro_Windows_x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ECC_Analyzer_Pro_Windows_x64.zip
          generate_release_notes: true
